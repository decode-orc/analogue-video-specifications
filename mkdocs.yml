site_name: Analogue Video Specifications
site_description: Reference material for analogue television systems and LaserDisc formats.
site_url: https://decode-orc.github.io/analogue-video-specifications/
repo_url: https://github.com/decode-orc/analogue-video-specifications
repo_name: decode-orc/analogue-video-specifications
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
docs_dir: docs
site_dir: site
exclude_docs: |
  .DS_Store
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/layout.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - javascripts/katex.js
nav:
  - Home: index.md
